[extend]
useDefault = true

# Verified SHA-256 of this public file; not a credential. Narrow exception only.
[[allowlists]]
description = "Verified file checksums in the reproducibility manifest"
condition = "AND"
paths = ['(^|/)SHA256SUMS\.json$']
regexTarget = "line"
regexes = ['"(deploy/photoprot-api\.service|\.github/workflows/secret-scan\.yml)": "[a-f0-9]{64}"']
